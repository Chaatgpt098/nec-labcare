<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEC LabCare Admin</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial}body{margin:0;background:#f8fafc}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:15px}
.login-card{background:white;width:100%;max-width:380px;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0003;text-align:center}
.login-card h2{margin:0;color:#1e3a8a}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:10px;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px;background:#1e3a8a;color:white}
.pass-wrap{position:relative;margin-top:10px}.pass-wrap input{margin:0;padding-right:45px}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
.header{background:#1e3a8a;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.header h3{margin:0}
.btn-sm{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-size:13px;font-weight:600}.btn-gray{background:#e2e8f0}.btn-green{background:#dcfce7;color:#166534}.btn-red{background:#fee2e2;color:#dc2626}
.container{max-width:950px;margin:15px auto;padding:0 15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:white;padding:12px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #0001}.stat b{font-size:20px;display:block}
.report-box{background:white;padding:14px 16px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:15px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.report-box select,.report-box input{width:auto;flex:1;min-width:140px;margin:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.f-btn{padding:8px 14px;border-radius:20px;border:1px solid #cbd5e1;background:white;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600}.f-btn.active{background:#1e3a8a;color:white}
.card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0001;margin-bottom:12px;border-left:5px solid #3b82f6}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.assigned{background:#dbeafe;color:#1e40af}.solved{background:#dcfce7;color:#166534}
.meta{font-size:13px;color:#64748b;margin:6px 0}.row{display:flex;gap:8px;margin-top:10px}.row select{flex:1;margin:0}.row button{width:auto;padding:8px 16px;margin:0;background:#1e3a8a;color:white;border:0;border-radius:8px;font-weight:600;cursor:pointer}.empty{text-align:center;padding:40px;color:#94a3b8;background:white;border-radius:14px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="loginDiv" class="login-wrap"><div class="login-card"><h2>NEC LabCare</h2><p style="color:#64748b;font-size:13px">Secure Admin Panel</p>
<select id="roleSelect" onchange="showStaff()"><option value="">Select Role</option><option value="HOD">HOD / Admin</option><option value="STAFF">Programmer</option></select>
<div id="staffDiv" style="display:none"><select id="staffSelect"><option value="A.HARINI">A.HARINI - 3427 LAB</option><option value="Y.MARY RANI">Y.MARY RANI - 3305 LAB</option><option value="T.JAGADEESWARI">T.JAGADEESWARI - 3204 LAB</option><option value="S.MARIYA DASU">S.MARIYA DASU - 1205 LAB</option><option value="R.BHEEMA NAIK">R.BHEEMA NAIK - 1206 LAB</option></select></div>
<div class="pass-wrap"><input type="password" id="pass" placeholder="Enter Password"><span class="eye" onclick="togglePass()" id="eyeIcon">👁️</span></div>
<button class="btn" onclick="login()">Secure Login</button></div></div>

<div id="mainDiv" style="display:none">
<div class="header"><h3 id="welcome"></h3><div><button class="btn-sm btn-gray" onclick="location.reload()">Logout</button><button class="btn-sm btn-red" onclick="clearAll()">Clear</button></div></div>
<div class="container">
<div class="stats"><div class="stat"><b id="tAll">0</b>Total</div><div class="stat"><b id="tPen" style="color:#d97706">0</b>Pending</div><div class="stat"><b id="tAss" style="color:#2563eb">0</b>Assigned</div><div class="stat"><b id="tSol" style="color:#16a34a">0</b>Solved</div></div>

<div class="report-box">
<strong>📊 Monthly Report:</strong>
<input type="month" id="monthPick" onchange="onMonthChange()">
<button class="btn-sm btn-green" onclick="downloadCSV()">⬇️ Excel Download</button>
<button class="btn-sm btn-gray" onclick="clearMonth()">Show All</button>
</div>

<div id="filterBar" class="filters"></div>
<div id="complaints"></div>
</div></div>

<script>
const LAB_STAFF={"CSE(ET)-3427 LAB":"A.HARINI","CSE(ET)-3305 LAB":"Y.MARY RANI","CSE(ET)-3204 LAB":"T.JAGADEESWARI","CSE(ET)-1205 LAB":"S.MARIYA DASU","CSE(ET)-1206 LAB":"R.BHEEMA NAIK"};
const STAFF_LAB={"A.HARINI":"CSE(ET)-3427 LAB","Y.MARY RANI":"CSE(ET)-3305 LAB","T.JAGADEESWARI":"CSE(ET)-3204 LAB","S.MARIYA DASU":"CSE(ET)-1205 LAB","R.BHEEMA NAIK":"CSE(ET)-1206 LAB"};
const ALL_LABS=["CSE(ET)-3427 LAB","CSE(ET)-3305 LAB","CSE(ET)-3204 LAB","CSE(ET)-1205 LAB","CSE(ET)-1206 LAB"];
let currentUser=null,currentRole=null,activeFilter="ALL",reportMonth="";
function showStaff(){document.getElementById('staffDiv').style.display=document.getElementById('roleSelect').value==='STAFF'?'block':'none'}
function togglePass(){let p=document.getElementById('pass'),e=document.getElementById('eyeIcon');p.type=p.type==='password'?'text':'password';e.innerText=p.type==='password'?'👁️':'🙈';}
function login(){
  currentRole=document.getElementById('roleSelect').value;let pwd=document.getElementById('pass').value;
  if(!currentRole)return alert("Select Role");if(currentRole==='HOD'&&pwd!=='hod@nec')return alert("Wrong Password");if(currentRole==='STAFF'&&pwd!=='nec@123')return alert("Wrong Password");
  currentUser=currentRole==='HOD'?"HOD":document.getElementById('staffSelect').value;
  document.getElementById('loginDiv').style.display='none';document.getElementById('mainDiv').style.display='block';
  document.getElementById('welcome').innerText=currentRole==='HOD'?"HOD Panel - All Labs Live":`${currentUser} - ${STAFF_LAB[currentUser]}`;
  document.getElementById('monthPick').value=new Date().toISOString().slice(0,7);
  reportMonth=document.getElementById('monthPick').value;
  buildFilters(); render();
}
function buildFilters(){
  let bar=document.getElementById('filterBar'); if(currentRole!=='HOD'){bar.style.display='none';return;}
  let html=`<button class="f-btn ${activeFilter==='ALL'?'active':''}" onclick="setFilter('ALL')">All Labs</button>`;
  ALL_LABS.forEach(l=>{html+=`<button class="f-btn ${activeFilter===l?'active':''}" onclick="setFilter('${l}')">${l.replace('CSE(ET)-','')}</button>`});
  bar.innerHTML=html;
}
function setFilter(f){activeFilter=f;buildFilters();render();}
function onMonthChange(){reportMonth=document.getElementById('monthPick').value;render();}
function clearMonth(){reportMonth="";document.getElementById('monthPick').value="";render();}
function getC(){return JSON.parse(localStorage.getItem('nec_complaints')||'[]')}function saveC(c){localStorage.setItem('nec_complaints',JSON.stringify(c))}
function render(){
  let all=getC(); let base=currentRole==='HOD'?all:all.filter(c=>c.assignedTo===currentUser);
  let filteredBase=reportMonth? base.filter(c=>{try{return new Date(c.timestamp).toISOString().slice(0,7)===reportMonth}catch(e){return true}}):base;
  document.getElementById('tAll').innerText=filteredBase.length; document.getElementById('tPen').innerText=filteredBase.filter(x=>x.status==='Pending').length; document.getElementById('tAss').innerText=filteredBase.filter(x=>x.status==='Assigned').length; document.getElementById('tSol').innerText=filteredBase.filter(x=>x.status==='Solved').length;
  let filtered=currentRole==='HOD' && activeFilter!=='ALL'? filteredBase.filter(c=>c.lab===activeFilter) : filteredBase;
  let div=document.getElementById('complaints');
  if(filtered.length===0){div.innerHTML=`<div class="empty"><h3>No Complaints ${reportMonth?'in '+reportMonth:''}</h3><p>All good 🎉</p></div>`;return;}
  div.innerHTML=filtered.map(c=>{let col=c.status==='Solved'?'#22c55e':c.status==='Assigned'?'#3b82f6':'#f59e0b';return `<div class="card" style="border-left-color:${col}"><div style="display:flex;justify-content:space-between"><b>${c.lab} - PC ${c.pc}</b><span class="badge ${c.status.toLowerCase()}">${c.status}</span></div><div class="meta">Issue: <b>${c.issue}</b> | Student: ${c.student}<br>Assigned: <b style="color:#1e3a8a">${c.assignedTo}</b> | ${c.date}</div><div class="row"><select id="s${c.id}"><option ${c.status==='Pending'?'selected':''}>Pending</option><option ${c.status==='Assigned'?'selected':''}>Assigned</option><option ${c.status==='Solved'?'selected':''}>Solved</option></select><button onclick="updateStatus(${c.id})">Update</button></div></div>`}).join('');
}
function updateStatus(id){let all=getC();let idx=all.findIndex(x=>x.id===id);all[idx].status=document.getElementById('s'+id).value;saveC(all);render();}
function clearAll(){if(confirm("Delete all?")){localStorage.removeItem('nec_complaints');render();}}
function downloadCSV(){
  let all=getC(); let base=currentRole==='HOD'?all:all.filter(c=>c.assignedTo===currentUser);
  if(reportMonth){base=base.filter(c=>{try{return new Date(c.timestamp).toISOString().slice(0,7)===reportMonth}catch(e){return true}});}
  if(base.length===0)return alert("No data");
  let csv="Lab,PC No,Issue,Student,Assigned To,Status,Date\n";
  base.forEach(c=>{csv+=`"${c.lab}","${c.pc}","${c.issue}","${c.student}","${c.assignedTo}","${c.status}","${c.date}"\n`;});
  let blob=new Blob([csv],{type:'text/csv'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`NEC_Report_${reportMonth||'All'}.csv`; a.click();
}
</script></body></html>
