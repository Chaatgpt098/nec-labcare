<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title><style>body{font-family:sans-serif;background:#f1f5f9;padding:15px}.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px}</style></head><body><div class="card"><h2>NEC LabCare Admin - Testing Mode</h2><button onclick="addDemo()" style="padding:10px;background:green;color:white;border:0;border-radius:6px">+ Add Demo Complaint</button> <button onclick="clearAll()" style="padding:10px;background:red;color:white;border:0;border-radius:6px">Clear All</button><div id="list"></div></div><script>
const MAP={"CSE(ET)-3427 LAB":"A.HARINI","CSE(ET)-3305 LAB":"Y.MARY RANI","CSE(ET)-3204 LAB":"T.JAGADEESWARI","CSE(ET)-1205 LAB":"S.MARIYA DASU","CSE(ET)-1206 LAB":"R.BHEEMA NAIK"};
function get(){return JSON.parse(localStorage.getItem('nec_complaints')||'[]')}function save(d){localStorage.setItem('nec_complaints',JSON.stringify(d));render()}
function render(){let a=get();document.getElementById('list').innerHTML=a.map((c,i)=>`<div class=card><b>${c.lab}</b> - PC ${c.pc}<br>Issue:${c.issue}<br>Student:${c.student}<br>Assigned:${MAP[c.lab]||'Unknown'}<br>Status:<select id=s${i}><option>Pending</option><option>Assigned</option><option>Solved</option></select><button onclick="let l=get();l[${i}].status=document.getElementById('s${i}').value;save(l)">Update</button></div>`).join('')||'No complaints'}
function addDemo(){let a=get();a.push({lab:"CSE(ET)-3427 LAB",pc:"12",issue:"Mouse Not Working",student:"Test",date:new Date().toLocaleString(),status:"Pending"});save(a)}function clearAll(){localStorage.removeItem('nec_complaints');render()}render();
</script></body></html>
