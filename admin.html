<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEC(A) - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:#eef2ff;color:#111}
.nav{background:linear-gradient(135deg,#1e3a8a,#0f172a);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.college{line-height:1.3}
.college b{font-size:17px}
.college span{display:block;font-size:15px;font-weight:700;color:#93c5fd;margin-top:3px}
.college small{font-size:12px;color:#cbd5e1}
.nav a{color:#94a3b8;text-decoration:none;margin-left:14px;font-size:14px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.1)}
.nav a.active{color:#fff;background:#3b82f6;font-weight:700}
.container{max-width:900px;margin:24px auto;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:16px;padding:18px;text-align:center;box-shadow:0 8px 30px rgba(30,58,138,.08);border:1px solid #e0e7ff}
.stat b{font-size:28px;display:block;color:#1e3a8a}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(30,58,138,.08);border:1px solid #e0e7ff;margin-bottom:16px}
select,input{padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:10px;background:#f8fafc}
button{padding:8px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer;font-size:13px}
.btn-work{background:#dbeafe;color:#1e40af}.btn-solve{background:#dcfce7;color:#166534}.btn-del{background:#fee2e2;color:#991b1b}
.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.pending{background:#fef3c7;color:#92400e}.working{background:#dbeafe;color:#1e40af}.solved{background:#dcfce7;color:#166534}
.complaint{border:1.5px solid #e0e7ff;border-radius:14px;padding:16px;margin-top:14px;background:#f8faff}
.complaint img{max-width:100%;border-radius:12px;margin:10px 0;border:1px solid #ddd}
.footer{text-align:center;color:#64748b;font-size:12px;margin:24px}
</style>
</head>
<body>
<div class="nav">
<div class="college">
<b>NARASARAOPETA ENGINEERING COLLEGE (Autonomous)</b>
<span>Department of CSE (Emerging Technologies)</span>
<small>Admin Panel - LabCare</small>
</div>
<div style="display:flex"><a href="student.html">Student</a><a class="active">Admin</a></div>
</div>

<div class="container">
<div class="stats">
<div class="stat"><b id="t">0</b><small>Total</small></div>
<div class="stat"><b id="p">0</b><small>Pending</small></div>
<div class="stat"><b id="s">0</b><small>Solved</small></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<h2 style="color:#1e3a8a">All Complaints</h2>
<div><select id="filter" onchange="render()"><option value="All">All Status</option><option>Pending</option><option>Working</option><option>Solved</option></select> <select id="labF" onchange="render()"><option value="All">All Labs</option><option>CSE(ET)-1205 Lab</option><option>CSE(ET)-1206 Lab</option><option>CSE(ET)-3427 Lab</option><option>CSE(ET)-3305 Lab</option><option>CSE(ET)-3140 Lab</option></select></div>
</div>
<div id="list"></div>
</div>
<div class="footer">© 2026 NEC(A) | Admin Panel</div>
</div>

<script>
function get(){return JSON.parse(localStorage.getItem('labComplaints')||'[]')}function save(d){localStorage.setItem('labComplaints',JSON.stringify(d))}
function update(id,st){let d=get();let i=d.findIndex(x=>x.id==id);if(i>=0){d[i].status=st;save(d);render()}}
function del(id){if(!confirm('Delete?'))return;let d=get().filter(x=>x.id!=id);save(d);render()}
function render(){let d=get();document.getElementById('t').innerText=d.length;document.getElementById('p').innerText=d.filter(x=>x.status=='Pending').length;document.getElementById('s').innerText=d.filter(x=>x.status=='Solved').length;let f=document.getElementById('filter').value,lf=document.getElementById('labF').value;let fd=d.filter(x=>(f=='All'||x.status==f)&&(lf=='All'||x.lab==lf));document.getElementById('list').innerHTML=fd.map(c=>`
<div class="complaint">
<div style="display:flex;justify-content:space-between"><b>${c.lab} - ${c.pc} (${c.roll})</b><span class="badge ${c.status.toLowerCase()}">${c.status}</span></div>
<div style="margin:8px 0"><b>${c.type}</b><br><small>${c.desc}</small></div>
${c.photo?`<img src="${c.photo}"><br>`:''}
<small>${c.time}</small>
<div style="margin-top:10px;display:flex;gap:8px">
<button class="btn-work" onclick="update(${c.id},'Working')">Working</button>
<button class="btn-solve" onclick="update(${c.id},'Solved')">Solved</button>
<button class="btn-del" onclick="del(${c.id})">Delete</button>
</div>
</div>`).join('')||'<p style="color:#888;margin-top:10px">No complaints found</p>';}
render();
</script>
</body>
</html>
