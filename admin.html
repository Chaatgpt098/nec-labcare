<!DOCTYPE html>
<html>
<head>
<title>NEC LabCare Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px}
select,button{padding:8px 12px;border-radius:6px;border:1px solid #ccc}
button{background:#1e3a8a;color:white;cursor:pointer;font-weight:bold}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.pending{background:#fef3c7}.assigned{background:#dbeafe}.solved{background:#dcfce7}
.login{max-width:420px;margin:60px auto;text-align:center}
h2{color:#1e3a8a}
</style>
</head>
<body>
<div id="loginDiv" class="card login">
<h2>NEC LabCare - Login</h2>
<select id="roleSelect" onchange="showStaff()" style="width:100%">
<option value="">Select Role</option>
<option value="HOD">HOD / Admin (All Labs)</option>
<option value="STAFF">Programmer</option>
</select><br><br>
<div id="staffDiv" style="display:none">
<select id="staffSelect" style="width:100%">
<option>A.HARINI</option>
<option>Y.MARY RANI</option>
<option>T.JAGADEESWARI</option>
<option>S.MARIYA DASU</option>
<option>R.BHEEMA NAIK</option>
</select><br><br>
</div>
<button onclick="login()" style="width:100%">Login</button>
</div>

<div id="mainDiv" style="display:none">
<h2 id="welcome"></h2>
<button onclick="location.reload()" style="background:#64748b">Logout</button>
<hr>
<div id="complaints"></div>
</div>

<script>
const LAB_STAFF = {
  "CSE(ET)-3427 LAB": "A.HARINI",
  "CSE(ET)-3305 LAB": "Y.MARY RANI",
  "CSE(ET)-3204 LAB": "T.JAGADEESWARI",
  "CSE(ET)-1205 LAB": "S.MARIYA DASU",
  "CSE(ET)-1206 LAB": "R.BHEEMA NAIK"
};
const STAFF_LAB = {};
for(let lab in LAB_STAFF){ STAFF_LAB[LAB_STAFF[lab]] = lab }
let currentUser=null, currentRole=null;

function showStaff(){ document.getElementById('staffDiv').style.display = document.getElementById('roleSelect').value==='STAFF'?'block':'none'; }
function login(){
  currentRole=document.getElementById('roleSelect').value;
  if(!currentRole) return alert("Select Role");
  if(currentRole==='STAFF') currentUser=document.getElementById('staffSelect').value;
  else currentUser="HOD";
  document.getElementById('loginDiv').style.display='none';
  document.getElementById('mainDiv').style.display='block';
  document.getElementById('welcome').innerText = currentRole==='HOD'? "HOD Panel - All 5 Labs" : `${currentUser} - ${STAFF_LAB[currentUser]}`;
  render();
}
function getComplaints(){ return JSON.parse(localStorage.getItem('nec_complaints')||'[]'); }
function saveComplaints(c){ localStorage.setItem('nec_complaints', JSON.stringify(c)); }

function render(){
  let all=getComplaints();
  let filtered = currentRole==='HOD'? all : all.filter(c=> c.lab.trim()===STAFF_LAB[currentUser].trim());
  let html='';
  if(filtered.length===0) html='<div class="card">No complaints in your lab</div>';
  filtered.forEach(c=>{
    let realIndex = all.indexOf(c);
    let assignedTo = LAB_STAFF[c.lab] || LAB_STAFF[c.lab.trim()] || "Not Assigned";
    html+=`<div class="card">
    <b>${c.lab}</b> | PC-${c.pc} <span class="badge ${c.status==='Solved'?'solved':c.status==='Assigned'?'assigned':'pending'}">${c.status}</span><br>
    <small>Issue: ${c.issue} | Student: ${c.student} | ${c.date||''}</small><br><br>
    <b>Assigned To:</b> ${assignedTo}<br><br>
    ${(currentRole==='HOD' || currentUser===assignedTo)? `
    <select id="s${realIndex}"><option ${c.status==='Pending'?'selected':''}>Pending</option><option ${c.status==='Assigned'?'selected':''}>Assigned</option><option ${c.status==='Solved'?'selected':''}>Solved</option></select>
    <button onclick="updateStatus(${realIndex})">Update Status</button>` : `<i style="color:red">Only ${assignedTo} can solve this complaint</i>`}
    </div>`;
  });
  document.getElementById('complaints').innerHTML=html;
}
function updateStatus(idx){
  let all=getComplaints();
  let newStatus=document.getElementById('s'+idx).value;
  all[idx].status=newStatus;
  all[idx].solvedBy=currentUser;
  all[idx].solvedAt=new Date().toLocaleString();
  saveComplaints(all);
  alert(`Status updated to ${newStatus} by ${currentUser}`);
  render();
}
</script>
</body>
</html>
