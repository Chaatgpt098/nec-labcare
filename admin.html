<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEC LabCare Admin</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial}body{margin:0;background:#f8fafc;color:#1e293b}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#3b82f6);padding:15px}
.login-card{background:white;width:100%;max-width:380px;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0003;text-align:center}
.login-card h2{margin:0 0 6px;color:#1e3a8a}.login-card p{color:#64748b;font-size:13px;margin-bottom:18px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:10px;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px}.btn-primary{background:#1e3a8a;color:white}
.pass-wrap{position:relative;margin-top:10px}.pass-wrap input{margin:0;padding-right:45px}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
.header{background:#1e3a8a;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.header h3{margin:0}
.btn-sm{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;font-size:13px;font-weight:600}.btn-gray{background:#e2e8f0}.btn-red{background:#fee2e2;color:#dc2626}
.container{max-width:900px;margin:20px auto;padding:0 15px}.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001;margin-bottom:14px;border-left:5px solid #3b82f6}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.assigned{background:#dbeafe;color:#1e40af}.solved{background:#dcfce7;color:#166534}
.meta{font-size:13px;color:#64748b;margin:6px 0}.row{display:flex;gap:8px;margin-top:10px}.row select{flex:1;margin:0}.row button{width:auto;padding:8px 16px;margin:0;background:#1e3a8a;color:white;border:0;border-radius:8px;font-weight:600;cursor:pointer}.empty{text-align:center;padding:40px;color:#94a3b8}
</style></head><body>
<div id="loginDiv" class="login-wrap"><div class="login-card"><h2>NEC LabCare</h2><p>Secure Admin Panel - CSE(ET) Labs</p>
<select id="roleSelect" onchange="showStaff()"><option value="">Select Role</option><option value="HOD">HOD / Admin</option><option value="STAFF">Programmer</option></select>
<div id="staffDiv" style="display:none"><select id="staffSelect"><option value="A.HARINI">A.HARINI - 3427 LAB</option><option value="Y.MARY RANI">Y.MARY RANI - 3305 LAB</option><option value="T.JAGADEESWARI">T.JAGADEESWARI - 3204 LAB</option><option value="S.MARIYA DASU">S.MARIYA DASU - 1205 LAB</option><option value="R.BHEEMA NAIK">R.BHEEMA NAIK - 1206 LAB</option></select></div>
<div class="pass-wrap"><input type="password" id="pass" placeholder="Enter Password"><span class="eye" onclick="togglePass()" id="eyeIcon">👁️</span></div>
<button class="btn btn-primary" onclick="login()">Secure Login</button></div></div>
<div id="mainDiv" style="display:none"><div class="header"><h3 id="welcome"></h3><div><button class="btn-sm btn-gray" onclick="location.reload()">Logout</button><button class="btn-sm btn-red" onclick="clearAll()">Clear All</button></div></div><div class="container"><div id="complaints"></div></div></div>
<script>
const LAB_STAFF={"CSE(ET)-3427 LAB":"A.HARINI","CSE(ET)-3305 LAB":"Y.MARY RANI","CSE(ET)-3204 LAB":"T.JAGADEESWARI","CSE(ET)-1205 LAB":"S.MARIYA DASU","CSE(ET)-1206 LAB":"R.BHEEMA NAIK"};
const STAFF_LAB={"A.HARINI":"CSE(ET)-3427 LAB","Y.MARY RANI":"CSE(ET)-3305 LAB","T.JAGADEESWARI":"CSE(ET)-3204 LAB","S.MARIYA DASU":"CSE(ET)-1205 LAB","R.BHEEMA NAIK":"CSE(ET)-1206 LAB"};
let currentUser=null,currentRole=null;
function showStaff(){document.getElementById('staffDiv').style.display=document.getElementById('roleSelect').value==='STAFF'?'block':'none'}
function togglePass(){let p=document.getElementById('pass'),e=document.getElementById('eyeIcon');if(p.type==='password'){p.type='text';e.innerText='🙈';}else{p.type='password';e.innerText='👁️';}}
function login(){currentRole=document.getElementById('roleSelect').value;let pwd=document.getElementById('pass').value;if(!currentRole)return alert("Select Role");if(currentRole==='HOD'&&pwd!=='hod@nec')return alert("Wrong Password! Use hod@nec");if(currentRole==='STAFF'&&pwd!=='nec@123')return alert("Wrong Password! Use nec@123");currentUser=currentRole==='HOD'?"HOD":document.getElementById('staffSelect').value;document.getElementById('loginDiv').style.display='none';document.getElementById('mainDiv').style.display='block';document.getElementById('welcome').innerText=currentRole==='HOD'?"HOD Panel - All 5 Labs":`${currentUser} - ${STAFF_LAB[currentUser]}`;render();}
function getC(){return JSON.parse(localStorage.getItem('nec_complaints')||'[]')}function saveC(c){localStorage.setItem('nec_complaints',JSON.stringify(c))}
function render(){let all=getC();let filtered=currentRole==='HOD'?all:all.filter(c=>c.assignedTo===currentUser);let div=document.getElementById('complaints');if(filtered.length===0){div.innerHTML='<div class="card empty"><h3>No Complaints</h3><p>All labs working fine 🎉</p></div>';return;}div.innerHTML=filtered.map(c=>{let col=c.status==='Solved'?'#22c55e':c.status==='Assigned'?'#3b82f6':'#f59e0b';return `<div class="card" style="border-left-color:${col}"><div style="display:flex;justify-content:space-between;gap:10px"><b>${c.lab} - PC ${c.pc}</b><span class="badge ${c.status.toLowerCase()}">${c.status}</span></div><div class="meta">Issue: <b>${c.issue}</b><br>Student: ${c.student} | ${c.date}<br>Assigned: <b style="color:#1e3a8a">${c.assignedTo}</b>${c.desc?'<br>Note: '+c.desc:''}</div><div class="row"><select id="s${c.id}"><option ${c.status==='Pending'?'selected':''}>Pending</option><option ${c.status==='Assigned'?'selected':''}>Assigned</option><option ${c.status==='Solved'?'selected':''}>Solved</option></select><button onclick="updateStatus(${c.id})">Update</button></div></div>`}).join('');}
function updateStatus(id){let all=getC();let idx=all.findIndex(x=>x.id===id);if(idx>-1){all[idx].status=document.getElementById('s'+id).value;all[idx].solvedBy=currentUser;saveC(all);render();}}
function clearAll(){if(confirm("Delete all complaints? This cannot be undone!")){localStorage.removeItem('nec_complaints');render();}}
</script></body></html>
