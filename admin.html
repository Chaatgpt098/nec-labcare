<!DOCTYPE html>
<html><head><title>NEC LabCare Admin</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:Arial;background:#f1f5f9;padding:15px}.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px}input,select,button{padding:10px;border-radius:6px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin-top:8px}button{background:#1e3a8a;color:white;font-weight:bold;cursor:pointer}.login{max-width:400px;margin:50px auto}</style></head><body>
<div id="loginDiv" class="card login"><h2>NEC LabCare - Secure Login</h2>
<select id="roleSelect" onchange="showStaff()"><option value="">Select Role</option><option value="HOD">HOD / Admin</option><option value="STAFF">Programmer</option></select>
<div id="staffDiv" style="display:none"><select id="staffSelect"><option>A.HARINI</option><option>Y.MARY RANI</option><option>T.JAGADEESWARI</option><option>S.MARIYA DASU</option><option>R.BHEEMA NAIK</option></select></div>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">Login</button>
<p style="font-size:12px;color:gray">HOD pwd: hod@nec | Staff pwd: nec@123</p>
</div>
<div id="mainDiv" style="display:none"><h2 id="welcome"></h2><button onclick="location.reload()" style="background:#64748b">Logout</button> <button onclick="clearAll()" style="background:red">Clear</button><hr><div id="complaints"></div></div>
<script>
const LAB_STAFF={"CSE(ET)-3427 LAB":"A.HARINI","CSE(ET)-3305 LAB":"Y.MARY RANI","CSE(ET)-3204 LAB":"T.JAGADEESWARI","CSE(ET)-1205 LAB":"S.MARIYA DASU","CSE(ET)-1206 LAB":"R.BHEEMA NAIK"};
const STAFF_LAB={};for(let l in LAB_STAFF){STAFF_LAB[LAB_STAFF[l]]=l}
let currentUser=null,currentRole=null;
function showStaff(){document.getElementById('staffDiv').style.display=document.getElementById('roleSelect').value==='STAFF'?'block':'none'}
function login(){
  currentRole=document.getElementById('roleSelect').value;
  let pwd=document.getElementById('pass').value;
  if(!currentRole)return alert("Select Role");
  if(currentRole==='HOD' && pwd!=='hod@nec')return alert("Wrong HOD Password!");
  if(currentRole==='STAFF' && pwd!=='nec@123')return alert("Wrong Staff Password!");
  if(currentRole==='STAFF')currentUser=document.getElementById('staffSelect').value; else currentUser="HOD";
  document.getElementById('loginDiv').style.display='none';document.getElementById('mainDiv').style.display='block';
  document.getElementById('welcome').innerText=currentRole==='HOD'?"HOD Panel - All Labs":`${currentUser} - ${STAFF_LAB[currentUser]}`;
  render();
}
function getC(){return JSON.parse(localStorage.getItem('nec_complaints')||'[]')}function saveC(c){localStorage.setItem('nec_complaints',JSON.stringify(c))}
function render(){let all=getC();let f=currentRole==='HOD'?all:all.filter(c=>c.lab.trim()===STAFF_LAB[currentUser].trim());document.getElementById('complaints').innerHTML=f.map((c,i)=>{let idx=all.indexOf(c);return `<div class=card><b>${c.lab}</b> | PC-${c.pc}<br>Issue:${c.issue} | ${c.student}<br>Assigned:${LAB_STAFF[c.lab]}<br>Status:${c.status}<br><select id=s${idx}><option ${c.status==='Pending'?'selected':''}>Pending</option><option ${c.status==='Assigned'?'selected':''}>Assigned</option><option ${c.status==='Solved'?'selected':''}>Solved</option></select><button onclick="let a=getC();a[${idx}].status=document.getElementById('s${idx}').value;saveC(a);render()">Update</button></div>`}).join('')||'No complaints'}
function clearAll(){if(confirm("Delete all?")){localStorage.removeItem('nec_complaints');render()}}
</script></body></html>
