<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEC LabCare - Student</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial}body{margin:0;background:#f1f5f9}
.header{background:#1e3a8a;color:white;text-align:center;padding:20px}.header h1{margin:0}.header p{margin:5px 0 0;opacity:.9}
.form{max-width:500px;background:white;margin:20px auto;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:10px;font-size:14px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#1e3a8a;color:white;font-weight:700;font-size:15px;margin-top:14px;cursor:pointer}
.info{font-size:12px;color:#64748b;margin-top:8px;text-align:center}
.success{background:#dcfce7;color:#166534;padding:12px;border-radius:10px;margin-top:12px;text-align:center;display:none}
</style></head><body>
<div class="header"><h1>NEC LabCare</h1><p>Computer Lab Complaint System - CSE(ET) Dept</p></div>
<div class="form"><h3 style="margin:0;color:#1e3a8a">Raise a Complaint</h3>
<select id="lab"><option value="">Select Lab</option><option>CSE(ET)-3427 LAB</option><option>CSE(ET)-3305 LAB</option><option>CSE(ET)-3204 LAB</option><option>CSE(ET)-1205 LAB</option><option>CSE(ET)-1206 LAB</option></select>
<input id="pc" placeholder="PC Number (Ex: 15)">
<select id="issue"><option>System Not Working</option><option>Keyboard Issue</option><option>Mouse Issue</option><option>Monitor Issue</option><option>Software Issue</option><option>Internet Issue</option><option>Power Issue</option><option>Other</option></select>
<input id="student" placeholder="Your Name / Roll No">
<textarea id="desc" placeholder="Describe issue (optional)"></textarea>
<button class="btn" onclick="submitComplaint()">Submit Complaint</button>
<div id="ok" class="success">Complaint Submitted Successfully! ✅<br>Assigned staff will check soon.</div>
<div class="info">Your complaint will be auto-assigned to lab programmer.<br><a href="admin.html" style="color:#1e3a8a">Admin Login</a></div>
</div>
<script>
const LAB_STAFF={"CSE(ET)-3427 LAB":"A.HARINI","CSE(ET)-3305 LAB":"Y.MARY RANI","CSE(ET)-3204 LAB":"T.JAGADEESWARI","CSE(ET)-1205 LAB":"S.MARIYA DASU","CSE(ET)-1206 LAB":"R.BHEEMA NAIK"};
function submitComplaint(){
  let lab=document.getElementById('lab').value,pc=document.getElementById('pc').value,issue=document.getElementById('issue').value,student=document.getElementById('student').value;
  if(!lab||!pc||!student)return alert("Please fill Lab, PC No, Name");
  let all=JSON.parse(localStorage.getItem('nec_complaints')||'[]');
  all.push({id:Date.now(),lab:lab,pc:pc,issue:issue,student:student,desc:document.getElementById('desc').value,status:'Pending',assignedTo:LAB_STAFF[lab],date:new Date().toLocaleString()});
  localStorage.setItem('nec_complaints',JSON.stringify(all));
  document.getElementById('ok').style.display='block';document.getElementById('pc').value='';document.getElementById('student').value='';document.getElementById('desc').value='';
  setTimeout(()=>document.getElementById('ok').style.display='none',3000);
}
</script></body></html>
