<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEC(A) LabCare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:#eef2ff;color:#111}
.nav{background:linear-gradient(135deg,#1e3a8a,#0f172a);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.college{line-height:1.3}
.college b{font-size:17px;letter-spacing:.3px}
.college span{display:block;font-size:15px;font-weight:700;color:#93c5fd;margin-top:3px}
.college small{font-size:12px;color:#cbd5e1}
.nav a{color:#94a3b8;text-decoration:none;margin-left:14px;font-size:14px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.1)}
.nav a.active{color:#fff;background:#3b82f6;font-weight:700}
.container{max-width:740px;margin:24px auto;padding:0 14px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(30,58,138,.08);margin-bottom:18px;border:1px solid #e0e7ff}
.card h2{color:#1e3a8a}
label{font-weight:700;font-size:14px;display:block;margin:16px 0 6px;color:#334155}
input,select,textarea{width:100%;padding:13px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:15px;background:#f8fafc}
input:focus,select:focus,textarea:focus{border-color:#3b82f6;outline:none;background:#fff}
button{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border:0;padding:14px;width:100%;border-radius:12px;margin-top:20px;font-weight:800;font-size:15px;cursor:pointer;letter-spacing:.3px}
button:active{transform:scale(.98)}
.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.pending{background:#fef3c7;color:#92400e}.working{background:#dbeafe;color:#1e40af}.solved{background:#dcfce7;color:#166534}
.complaint{border:1.5px solid #e0e7ff;border-radius:14px;padding:16px;margin-top:14px;background:#f8faff}
img{max-width:100%;border-radius:12px;margin-top:12px;border:1px solid #ddd}
.footer{text-align:center;color:#64748b;font-size:12px;margin:24px}
</style>
</head>
<body>
<div class="nav">
<div class="college">
<b>NARASARAOPETA ENGINEERING COLLEGE (Autonomous)</b>
<span>Department of CSE (Emerging Technologies)</span>
<small>LabCare - Lab Maintenance Portal</small>
</div>
<div style="display:flex"><a class="active">Student</a><a href="admin.html">Admin</a></div>
</div>

<div class="container">
<div class="card">
<h2>📝 New Complaint</h2>
<label>Roll No</label><input id="roll" placeholder="Ex: 22A91A05XX">
<label>Lab Name</label><select id="lab"><option>CSE(ET)-1205 Lab</option><option>CSE(ET)-1206 Lab</option><option>CSE(ET)-3427 Lab</option><option>CSE(ET)-3305 Lab</option><option>CSE(ET)-3140 Lab</option></select>
<label>System No</label><input id="pc" placeholder="Ex: PC-15">
<label>Problem Type</label><select id="type"><option>System Not Booting</option><option>No Internet / Network Issue</option><option>Keyboard / Mouse Not Working</option><option>Monitor Issue</option><option>Software Missing</option><option>Power Issue</option><option>Other</option></select>
<label>Description</label><textarea id="desc" rows="3" placeholder="Explain issue clearly..."></textarea>
<label>System Photo (Optional)</label><input type="file" id="photo" accept="image/*"><img id="preview" style="display:none">
<button onclick="submitC()">Submit Complaint →</button>
</div>
<div class="card"><h2>📋 My Complaints</h2><div id="list"></div></div>
<div class="footer">© 2026 NEC(A) | Dept of CSE(ET) | Designed for Lab Maintenance</div>
</div>

<script>
let photoData='';
document.getElementById('photo').addEventListener('change',e=>{let r=new FileReader();r.onload=x=>{photoData=x.target.result;document.getElementById('preview').src=photoData;document.getElementById('preview').style.display='block'};r.readAsDataURL(e.target.files[0]);});
function get(){return JSON.parse(localStorage.getItem('labComplaints')||'[]')}function save(d){localStorage.setItem('labComplaints',JSON.stringify(d))}
function submitC(){let roll=document.getElementById('roll').value.trim(),lab=document.getElementById('lab').value,pc=document.getElementById('pc').value.trim(),type=document.getElementById('type').value,desc=document.getElementById('desc').value.trim();if(!roll||!pc){alert('Roll No & System No kavali');return}let d=get();d.unshift({id:Date.now(),roll,lab,pc,type,desc,photo:photoData,status:'Pending',time:new Date().toLocaleString()});save(d);photoData='';document.getElementById('preview').style.display='none';document.getElementById('photo').value='';document.getElementById('desc').value='';render();alert('Submitted!');}
function render(){let d=get();let r=document.getElementById('roll').value.trim().toLowerCase();let f=r?d.filter(x=>x.roll.toLowerCase()==r):d;document.getElementById('list').innerHTML=f.map(c=>`<div class="complaint"><div style="display:flex;justify-content:space-between"><b>${c.lab} - ${c.pc}</b><span class="badge ${c.status.toLowerCase()}">${c.status}</span></div><div style="margin:8px 0"><b>${c.type}</b><br><small>${c.desc}</small></div>${c.photo?`<img src="${c.photo}">`:''}<br><small>${c.roll} • ${c.time}</small></div>`).join('')||'<small style="color:#888">No complaints yet. Submit one above.</small>';}
document.getElementById('roll').addEventListener('input',render);render();
</script>
</body>
</html>
